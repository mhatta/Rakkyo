plugins {
    id 'com.android.application'
}

android {
    namespace = 'org.mhatta.rakkyo'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.mhatta.rakkyo'
        // Orchid's minimum (X509ExtendedTrustManager, endpoint identification)
        minSdk = 24
        targetSdk = 36
        versionCode = 3
        versionName = '1.1.1'
    }

    androidResources {
        // Writes the per-app language list (Android 13+) from the values-*
        // directories; the default strings are English (res/resources.properties).
        generateLocaleConfig = true
    }

    buildTypes {
        release {
            // R8 removes the code and resources the app does not use
            // (F-Droid asks for it).  It does not rename anything: see
            // proguard-rules.pro.  R8 is deterministic, so the release is
            // still reproducible with the same JDK and Android Gradle Plugin.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lint {
        // Every string must be translated: a missing Japanese string is an
        // error, not a fallback to English.
        error += 'MissingTranslation'
        abortOnError = true
    }

    dependenciesInfo {
        // No signing block of Google's in the APK (F-Droid asks for this).
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'org.mhatta:orchid:2.9.0'

    testImplementation 'junit:junit:4.13.2'
}
