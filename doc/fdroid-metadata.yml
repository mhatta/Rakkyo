# `fdroid build -v -l org.mhatta.rakkyo` before sending; remove these
# comments there, `fdroid rewritemeta` does).  The first submission has
# only the latest version.  In fdroiddata, `commit:` is the full hash of
# the commit the tag points to (git rev-parse v1.1.1^{commit}).
