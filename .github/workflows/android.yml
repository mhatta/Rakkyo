name: Android

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

# The actions are pinned to commits, as in Orchid; Dependabot proposes updates.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # The runner image has the Android SDK; Gradle installs the platform it needs.
      # Every download is checked against gradle/verification-metadata.xml.
      # assembleRelease too, so that what a release needs is checked here
      # before the release.
      - name: Unit tests, lint, debug and release APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rakkyo-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore
          retention-days: 14
